name: Draft commands

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: read   # without it, GitHub search leaves PRs out of the results

concurrency:
  group: social-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_PERSON_URN: ${{ vars.LINKEDIN_PERSON_URN }}
  LINKEDIN_TOKEN_EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
  LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
  LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
  LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  LINKEDIN_TOKEN_KEY: ${{ secrets.LINKEDIN_TOKEN_KEY }}
  LINKEDIN_PAGES_REDIRECT: ${{ vars.LINKEDIN_PAGES_REDIRECT }}

jobs:
  command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the command
        run: python3 scripts/social/run.py command
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update post history"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

  milestone:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'milestone' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft a post for the milestone
        run: python3 scripts/social/run.py milestone

  linkedin-renewal:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.body, '/linkedin-code')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exchange the LinkedIn code
        run: python3 scripts/social/run.py linkedin-issue
      - name: Save the renewed token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Update post history"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
